local_costmap:
  local_costmap:
    ros__parameters:
      # ...
      observation_sources: scan_filtered cliff_virtual
      
      scan_filtered:
        topic: /local/filtered_obstacles
        max_obstacle_height: 2.0
        min_obstacle_height: 0.05
        
        # WICHTIG: Marking (Eintragen)
        marking: true
        
        # WICHTIG: Clearing (Löschen)
        clearing: true
        
        # Raytracing-Konfiguration für Hesai XT16
        # Hindernisse werden nur gelöscht, wenn der Strahl mindestens so lang ist:
        raytrace_min_range: 0.7  # Etwas größer als deine Totzone (0.6m)
        
        # Maximale Reichweite, in der wir aktiv nach "Freiraum" suchen
        raytrace_max_range: 10.0
      
controller_server:
  ros__parameters:
    # ...
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      parameters:
        # ...
        # Geschwindigkeitsgrenzen
        vx_min: -0.1  # Erlaube nur sehr langsames Rückwärtsfahren (oder 0.0 für Verbot)
        vx_max: 0.5
        
        # Kritiker (Critics) Gewichtung
        critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "ObstacleCritic"]

        # Strafe für Rückwärtsfahren erhöhen!
        PathFollowCritic:
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 1.4

        # Diese Einstellung bestraft Bewegungen entgegen der Pfadrichtung
        # Wenn der globale Pfad vorwärts zeigt, wird rückwärts extrem teuer.
